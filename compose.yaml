name: rk-varaha-crm
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Run npm run auth:init-dev}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run npm run auth:init-dev}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?Run npm run auth:init-dev}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Run npm run auth:init-dev}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run npm run auth:init-dev}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Run npm run auth:init-dev}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/keycloak/rk-varaha-crm-realm.json:/opt/keycloak/data/import/rk-varaha-crm-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
  api:
    build: .
    command:
      [
        'sh',
        '-c',
        'npm run db:deploy && npm exec --workspace @rk/api -- nest start --watch',
      ]
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_IDENTITY_ID: ${BOOTSTRAP_ADMIN_IDENTITY_ID:-}
      BOOTSTRAP_ORGANIZATION_SLUG: ${BOOTSTRAP_ORGANIZATION_SLUG:-rk-varaha-dev}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-ORG_ADMIN}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Use an explicit IPv4 loopback and a tiny Node-only probe. This avoids
      # localhost/IPv6 resolution differences on Docker Desktop and keeps the
      # healthcheck independent of curl/wget availability in the slim image.
      test: ['CMD', 'node', '/workspace/scripts/api-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
  web:
    build: .
    command: ['npm', 'run', 'dev', '--workspace', '@rk/web']
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  keycloak_data:
